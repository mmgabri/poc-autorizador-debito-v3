server:
  port: 9096

grpc:
  server:
    port: 59096
    host: localhost

spring:
  data:
    redis:
      host: ${REDIS_HOST:}
      port: 6379

aws:
  sqs:
    region: "us-east-1"
    queue-name: "queue-comando-conta"

app:
  async:
    response-timeout-seconds: 30

custom:
  sleep: 1

logging:
  level:
    br.com.mmgabri: ${LOGGING_LEVEL:INFO}
  pattern:
    level: "%5p [ledger-service=${INSTANCIA_IP:localhost}]"