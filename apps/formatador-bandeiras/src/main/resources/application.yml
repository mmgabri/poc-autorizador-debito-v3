spring:
  threads:
    virtual:
      enabled: true
  grpc:
    client:
      channel:
        autorizador:
          target: dns:///localhost:59091
          keepalive:
            time: 60s
            timeout: 60s
          idle:
            timeout: 60s

server:
  port: 9090

grpc:
  autorizador-client:
    timeout: 50000

aws:
  sqs:
    region: "us-east-1"
    reversal-queue-name: "queue-reversal-notification"

logging:
  level:
    br.com.mmgabri: DEBUG

management:
  metrics:
    distribution:
      percentiles-histogram:
        all: true
  datadog:
    metrics:
      export:
        apiKey: 35ca9af351b9a33a19bce59652d93092
        step: 5s
        uri: https://api.datadoghq.com/
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus