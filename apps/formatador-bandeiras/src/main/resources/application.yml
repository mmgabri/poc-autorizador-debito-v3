spring:
  threads:
    virtual:
      enabled=true:

server:
  port: 9090

grpc:
  autorizador-client:
    port: 59091
    host: localhost
    timeout: 50000

aws:
  sqs:
    region: "us-east-1"
    reversal-queue-name: "queue-reversal-autorizador"

custom:
  sleep: 1000

logging:
  level:
    br.com.mmgabri: info

management:
  metrics:
    distribution:
      percentiles-histogram:
        all: true
  datadog:
    metrics:
      export:
        apiKey: 7d84e7dd51f775e36ac5bf9a76257567
        step: 5s
        uri: https://us5.datadoghq.com/
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus