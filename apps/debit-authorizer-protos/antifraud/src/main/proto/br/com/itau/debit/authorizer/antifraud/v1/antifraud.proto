syntax = "proto3";
option java_multiple_files = true;
package br.com.itau.debit.authorizer.antifraud.v1;

import "br/com/itau/debit/authorizer/common/v1/business_result.proto";

// Observability context (x-correlation-id, x-transaction-id)
// travels as gRPC metadata, not in the payload.
service AntifraudService {
    rpc AnalyzeFraud (AnalyzeFraudRequest) returns (AnalyzeFraudResponse);
}

message AnalyzeFraudRequest {
    string accountId = 1;
    string amount = 2;
    string personType = 3;
    string productName = 4;
    string customReturn = 5;
    int32 sleep = 6;
}

// Technical failures are returned as gRPC error status + google.rpc.ErrorInfo.
message AnalyzeFraudResponse {
    br.com.itau.debit.authorizer.common.v1.BusinessResult result = 1;
}
