syntax = "proto3";
option java_multiple_files = true;
package br.com.itau.debit.authorizer.limit.v1;

import "br/com/itau/debit/authorizer/common/v1/business_result.proto";

// Observability context (x-correlation-id, x-transaction-id)
// travels as gRPC metadata, not in the payload.
service LimitService {
    rpc UpdateLimit (UpdateLimitRequest) returns (UpdateLimitResponse);
}

message UpdateLimitRequest {
    string accountId = 1;
    string amount = 2;
    string personType = 3;
    string operationType = 4;       // "SIMULACAO" | "EFETIVACAO"
    string customReturn = 5;
    int32 sleepCommit = 6;
    int32 sleepSimulation = 7;
}

// Technical failures are returned as gRPC error status + google.rpc.ErrorInfo.
message UpdateLimitResponse {
    string accountId = 1;
    br.com.itau.debit.authorizer.common.v1.BusinessResult result = 2;
}
