syntax = "proto3";
option java_multiple_files = true;
package br.com.itau.debit.authorizer.debitauthorizer.v1;

// Observability context (x-correlation-id, x-transaction-id)
// travels as gRPC metadata, not in the payload.
service AuthorizationService {
    rpc AuthorizeTransaction (AuthorizeTransactionRequest) returns (AuthorizeTransactionResponse);
}

message AuthorizeTransactionRequest {
    // Idempotency key: a repeated correlationId is rejected as duplicate (TA21).
    string correlationId = 1;
    map<string, string> messageIso = 2;

    // Simulation controls, forwarded to each dependency.
    string customReturnEnrichment = 3;
    int32 sleepEnrichment = 4;

    string customReturnRules = 5;
    int32 sleepRules = 6;

    string customReturnSecurity = 7;
    int32 sleepSecurity = 8;

    string customReturnLimit = 9;
    int32 sleepLimitCommit = 10;
    int32 sleepLimitSimulation = 11;

    string customReturnAccountPosting = 12;
    int32 sleepAccountPostingCommit = 13;
    int32 sleepAccountPostingSimulation = 14;

    string customReturnAntifraud = 15;
    int32 sleepAntifraud = 16;

    string reversalTransactionId = 17;
}

message AuthorizeTransactionResponse {
    // Generated by the authorizer; the key used later to request a reversal.
    // Empty when the transaction failed before the id was generated.
    string transactionId = 1;
    // Result travels in DE39 (00 approved, 96 system error, ...).
    map<string, string> messageIso = 2;
}
