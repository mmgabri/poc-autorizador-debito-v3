server:
  port: 9098

spring:
  threads:
    virtual:
      enabled: true
  grpc:
    client:
      channel:
        ledger:
          target: dns:///ledger-service-svc.autorizador-debito.svc.cluster.local:59096
          keepalive:
            time: 60s
            timeout: 60s
          idle:
            timeout: 60s

grpc:
  ledger-service-client:
    timeout: 5000

aws:
  sqs:
    enabled: true
    region: "us-east-1"
    queue-name: "queue-comando-conta"
    max-messages: 10
    wait-time-seconds: 20
    visibility-timeout-seconds: 120
    error-backoff-millis: 1000
    poll-threads: 20
    consumer-threads: 500

logging:
  level:
    br.com.mmgabri: ${LOGGING_LEVEL:INFO}

management:
  metrics:
    distribution:
      percentiles-histogram:
        all: true
  datadog:
    metrics:
      export:
        apiKey: ${DD_API_KEY}
        step: 5s
        uri: https://api.datadoghq.com/
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
