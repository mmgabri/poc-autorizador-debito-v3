server:
  port: 9098

grpc:
  ledger-service-client:
    port: 59096
    host: ledger-service-svc.autorizador-debito.local
    timeout: 5000

custom:
  sleep: 0

aws:
  sqs:
    enabled: true
    region: "us-east-1"
    queue-name: "queue-comando-conta"
    max-messages: 10
    wait-time-seconds: 20
    visibility-timeout-seconds: 120
    error-backoff-millis: 1000
    poll-threads: 20
    consumer-threads: 500

logging:
  level:
    br.com.mmgabri: ${LOGGING_LEVEL:INFO}

management:
  metrics:
    distribution:
      percentiles-histogram:
        all: true
  datadog:
    metrics:
      export:
        apiKey: ${DD_API_KEY}
        step: 5s
        uri: https://us5.datadoghq.com/
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus